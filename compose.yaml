services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music_local_only
      POSTGRES_DB: music_diploma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music_diploma"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
